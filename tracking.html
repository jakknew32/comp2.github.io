<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดตามสถานะ — Chiangmai Freshmilk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#EEF3F5;
  --surface:#FFFFFF;
  --ink:#152430;
  --muted:#5C7182;
  --border:#DCE4E9;
  --accent:#F0AF2E;
  --accent-deep:#B87F0F;
  --accent-soft:#FDF1D9;
  --green:#2F7A4D;
  --green-soft:#E7F3EA;
  --red:#C4432B;
  --red-soft:#FBEAE5;
  --font-display:'Fraunces',serif;
  --font-body:'IBM Plex Sans Thai',system-ui,sans-serif;
  --r:16px;
}
body{
  font-family:var(--font-body);
  background:
    radial-gradient(ellipse 900px 500px at 15% -10%, #FFFFFF 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:0 0 60px;
}

/* ── HEADER ── */
.hero{
  width:100%;
  padding:44px 20px 32px;
  text-align:center;
  position:relative;
}
.brand-mark{
  display:inline-flex;align-items:center;gap:10px;
  margin-bottom:18px;
}
.brand-mark svg{flex-shrink:0}
.brand-mark span{
  font-family:var(--font-display);
  font-weight:600;
  font-size:15px;
  letter-spacing:.4px;
  color:var(--muted);
}
.hero h1{
  font-family:var(--font-display);
  font-weight:600;
  font-size:clamp(28px,6vw,40px);
  line-height:1.15;
  letter-spacing:-.3px;
  max-width:480px;
  margin:0 auto 10px;
}
.hero h1 em{font-style:italic;color:var(--accent-deep)}
.hero p{
  color:var(--muted);
  font-size:14.5px;
  max-width:360px;
  margin:0 auto;
}

/* ── SEARCH CARD ── */
.search-wrap{width:100%;max-width:480px;padding:0 20px;margin-top:8px}
.search-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px;
  box-shadow:0 1px 3px rgba(21,36,48,.05);
}
.search-label{
  font-size:11.5px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;
}
.search-row{display:flex;gap:8px}
.search-input{
  flex:1;min-width:0;
  border:1.5px solid var(--border);
  border-radius:10px;
  padding:13px 14px;
  font-family:var(--font-body);
  font-size:15px;
  color:var(--ink);
  background:var(--bg);
  transition:border-color .15s, background .15s;
}
.search-input:focus{outline:none;border-color:var(--accent-deep);background:var(--surface)}
.search-input::placeholder{color:#9AA9B4}
.search-btn{
  flex-shrink:0;
  border:none;border-radius:10px;
  background:var(--ink);color:#fff;
  padding:0 20px;
  font-family:var(--font-body);
  font-weight:600;font-size:14.5px;
  cursor:pointer;
  display:flex;align-items:center;gap:6px;
  transition:filter .15s, transform .15s;
}
.search-btn:hover{filter:brightness(1.15)}
.search-btn:active{transform:scale(.97)}
.search-btn:disabled{opacity:.55;cursor:default}
.search-hint{font-size:12px;color:var(--muted);margin-top:9px;line-height:1.5}

/* ── RESULT AREA ── */
.result-wrap{width:100%;max-width:480px;padding:0 20px;margin-top:18px}
.state-msg{
  background:var(--surface);
  border:1px dashed var(--border);
  border-radius:var(--r);
  padding:28px 20px;
  text-align:center;
  color:var(--muted);
  font-size:13.5px;
  animation:fadeIn .3s ease;
}
.state-msg.err{border-color:var(--red);border-style:solid;background:var(--red-soft);color:var(--red)}
.state-msg .ic{font-size:26px;display:block;margin-bottom:8px}

.result-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  overflow:hidden;
  animation:fadeIn .35s ease;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.result-top{
  padding:22px 22px 20px;
  display:flex;align-items:center;gap:16px;
  border-bottom:1px solid var(--border);
}
.bottle-wrap{flex-shrink:0;width:52px;height:72px}
.result-top-text{flex:1;min-width:0}
.result-order{
  font-family:'IBM Plex Sans Thai',monospace;
  font-size:12px;color:var(--muted);font-weight:600;
  letter-spacing:.3px;margin-bottom:3px;
}
.result-status-label{
  font-family:var(--font-display);
  font-weight:600;font-size:19px;line-height:1.25;
}
.result-status-label.st-pending{color:var(--accent-deep)}
.result-status-label.st-packed{color:var(--accent-deep)}
.result-status-label.st-delivered{color:var(--green)}
.result-status-label.st-problem{color:var(--red)}

.cancel-banner{
  margin:16px 22px 0;
  background:var(--red-soft);color:var(--red);
  border-radius:10px;padding:12px 14px;
  font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:8px;
}

/* ── TIMELINE ── */
.timeline{padding:22px 22px 8px;display:flex}
.tl-step{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative}
.tl-line{
  position:absolute;top:11px;left:-50%;width:100%;height:2px;
  background:var(--border);z-index:0;
}
.tl-step:first-child .tl-line{display:none}
.tl-line.done{background:var(--accent-deep)}
.tl-dot{
  width:24px;height:24px;border-radius:50%;
  background:var(--surface);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--muted);font-weight:700;
  z-index:1;transition:all .2s;
}
.tl-step.done .tl-dot{background:var(--accent-deep);border-color:var(--accent-deep);color:#fff}
.tl-step.done .tl-dot::after{content:'✓'}
.tl-step.done .tl-dot span{display:none}
.tl-label{font-size:10.5px;color:var(--muted);margin-top:7px;font-weight:600;line-height:1.3;max-width:70px}
.tl-step.done .tl-label{color:var(--ink)}

/* ── DETAIL LIST ── */
.detail-list{padding:14px 22px 22px}
.detail-row{
  display:flex;justify-content:space-between;gap:12px;
  padding:10px 0;border-bottom:1px solid var(--border);
  font-size:13.5px;
}
.detail-row:last-child{border-bottom:none}
.detail-row .k{color:var(--muted);flex-shrink:0}
.detail-row .v{font-weight:600;text-align:right;word-break:break-word}
.detail-row .v.mono{font-family:'IBM Plex Sans Thai',monospace}

.footer-note{
  text-align:center;color:var(--muted);font-size:11.5px;
  margin-top:28px;padding:0 20px;line-height:1.6;
}

/* ── TP HISTORY ── */
.tp-history{
  margin:0 22px 22px;padding-top:16px;border-top:1px solid var(--border);
}
.tp-history-title{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:12px}
.tp-event{display:flex;gap:10px;padding-bottom:14px;position:relative}
.tp-event:not(:last-child)::before{
  content:'';position:absolute;left:3px;top:14px;bottom:0;width:1.5px;background:var(--border);
}
.tp-event-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-deep);margin-top:4px;flex-shrink:0}
.tp-event-body{flex:1;min-width:0}
.tp-event-desc{font-size:13px;font-weight:600;color:var(--ink);line-height:1.4}
.tp-event-meta{font-size:11px;color:var(--muted);margin-top:2px}

@media (max-width:400px){
  .tl-label{font-size:9.5px;max-width:56px}
}
</style>
</head>
<body>

<div class="hero">
  <div class="brand-mark">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
      <path d="M9 2h6v3.2c0 .6.2 1.1.6 1.6l1.8 2.2c.4.5.6 1 .6 1.6V20a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V10.6c0-.6.2-1.1.6-1.6l1.8-2.2c.4-.5.6-1 .6-1.6V2Z" fill="#F0AF2E" stroke="#152430" stroke-width="1.3" stroke-linejoin="round"/>
      <path d="M6.6 13.5h10.8" stroke="#152430" stroke-width="1.3"/>
    </svg>
    <span>Chiangmai Freshmilk</span>
  </div>
  <h1>ตรวจสถานะ<br><em>ออเดอร์ของคุณ</em></h1>
  <p>กรอกเลขออเดอร์ หรือเลขแทร็กกิ้ง เพื่อดูสถานะการจัดส่งล่าสุด</p>
</div>

<div class="search-wrap">
  <div class="search-card">
    <div class="search-label">เลขออเดอร์ / เลขแทร็กกิ้ง</div>
    <div class="search-row">
      <input type="text" class="search-input" id="q" placeholder="เช่น 240715001 หรือ TH123456789" autocomplete="off" inputmode="text">
      <button class="search-btn" id="btn" onclick="doSearch()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        ค้นหา
      </button>
    </div>
    <div class="search-hint">ข้อมูลอ้างอิงจากระบบจัดส่งของ CFM อัปเดตตามรอบที่ทีมงานบันทึกสถานะ</div>
  </div>
</div>

<div class="result-wrap" id="result"></div>

<div class="footer-note">พบปัญหาการจัดส่ง หรือข้อมูลไม่ตรง ติดต่อทีมงาน Chiangmai Freshmilk</div>

<script>
const SHEET_ID='1nwcWVrH4kHdRuCiVT4fQUSWU8UCbiNbQECKD_NhXq44';
const SHEET_NAME='SCG';
// URL ของ Apps Script Web App เดียวกับที่ใช้ sync สถานะใน Zone.html (รองรับ action: trackThailandPost)
const APPS_SCRIPT_URL='';
const thMonths=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

let cachedRows=null;

function expandSciNotation(raw){
  const str=String(raw==null?'':raw).trim();
  const m=str.match(/^(-?)(\d+)(?:\.(\d+))?[eE]\+?(\d+)$/);
  if(!m)return str;
  const sign=m[1],intPart=m[2],fracPart=m[3]||'',exp=parseInt(m[4],10);
  let digits=intPart+fracPart;
  const pointPos=intPart.length+exp;
  while(digits.length<pointPos)digits+='0';
  return sign+digits.slice(0,pointPos);
}

function formatOrderDate(raw){
  if(!raw)return'';
  let d;
  const s=String(raw).trim();
  if(/^\d{5}$/.test(s)) d=new Date(Math.round((+s-25569)*86400*1000));
  else if(/\d{4}-\d{2}-\d{2}/.test(s)) d=new Date(s);
  else if(/\d{1,2}\/\d{1,2}\/\d{4}/.test(s)){const p=s.split('/');d=new Date(+p[2],+p[1]-1,+p[0]);}
  else d=new Date(s);
  if(isNaN(d))return String(raw);
  return`${d.getDate()} ${thMonths[d.getMonth()]} ${d.getFullYear()+543}`;
}

function classifyStatus(s){
  const str=String(s||'').trim();
  if(!str||str==='null'||str==='nan'||str==='NaT'||str==='0'||str==='-')return'pending';
  if(str.includes('ยกเลิก')||str.toLowerCase().includes('cancel'))return'problem';
  if(str.includes('ค้าง'))return'pending';
  if(str.includes('แพ็คสินค้าแล้ว'))return'packed';
  return'delivered';
}

function parseCSV(text){
  const rows=[];const lines=text.split('\n');
  for(const line of lines){
    if(!line.trim())continue;
    const row=[];let cur='',inQ=false;
    for(let i=0;i<line.length;i++){
      const c=line[i];
      if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(c===','&&!inQ){row.push(cur);cur='';}
      else{cur+=c;}
    }
    row.push(cur);rows.push(row);
  }
  return rows;
}

async function fetchThailandPostTracking(barcode){
  if(!APPS_SCRIPT_URL||!barcode)return null;
  try{
    const res=await fetch(APPS_SCRIPT_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'trackThailandPost',barcode})
    });
    const json=await res.json();
    if(!json.ok)return null;
    return json.data;
  }catch(e){return null;}
}

// หมายเหตุ: โครงสร้าง response ของ Thailand Post อาจต่างกันเล็กน้อยตามเวอร์ชัน API
// ฟังก์ชันนี้พยายามอ่านจากหลาย path ที่พบได้บ่อย ถ้าไม่พบข้อมูลจะคืน [] แทนการ error
function extractTPEvents(data){
  try{
    const items=data&&data.response&&data.response.items;
    if(!items)return[];
    const key=Object.keys(items)[0];
    if(!key)return[];
    const item=items[key];
    const arr=item.iterate||item.items||item.history||[];
    return arr.map(ev=>({
      date:ev.status_date||ev.date||ev.datetime||'',
      desc:ev.status_description||ev.description||ev.status||'',
      location:ev.location||ev.postcode||''
    })).filter(ev=>ev.desc).reverse(); // ใหม่สุดขึ้นก่อน
  }catch(e){return[];}
}

async function loadRows(){
  if(cachedRows)return cachedRows;
  const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error('โหลดข้อมูลไม่สำเร็จ');
  const text=await res.text();
  if(!text||text.trim().startsWith('<'))throw new Error('โหลดข้อมูลไม่สำเร็จ');
  cachedRows=parseCSV(text);
  return cachedRows;
}

function norm(s){return String(s||'').trim().toLowerCase().replace(/[\s-]/g,'');}

function bottleSVG(pct,cancelled){
  // pct: 0, 50, 100 fill level inside bottle
  const fillColor=cancelled?'#C4432B':'#F0AF2E';
  const fillH=cancelled?0:Math.round(46*(pct/100));
  const fillY=58-fillH;
  return `<svg width="52" height="72" viewBox="0 0 52 72" fill="none">
    <defs><clipPath id="bc"><path d="M17 14h18v6.2c0 1 .3 2 1 2.8l3 3.6c.7.9 1 1.9 1 3V64a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V29.6c0-1.1.3-2.1 1-3l3-3.6c.7-.8 1-1.8 1-2.8V14Z"/></clipPath></defs>
    <path d="M17 14h18v6.2c0 1 .3 2 1 2.8l3 3.6c.7.9 1 1.9 1 3V64a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4V29.6c0-1.1.3-2.1 1-3l3-3.6c.7-.8 1-1.8 1-2.8V14Z" fill="#fff" stroke="#152430" stroke-width="1.6" stroke-linejoin="round"/>
    <rect x="16" y="${fillY}" width="20" height="${fillH}" fill="${fillColor}" clip-path="url(#bc)" style="transition:all .5s ease"/>
    <rect x="15.5" y="10" width="21" height="5" rx="1.5" fill="#152430"/>
    ${cancelled?'<path d="M20 30 32 52M32 30 20 52" stroke="#C4432B" stroke-width="2.4" stroke-linecap="round"/>':''}
  </svg>`;
}

function renderLoading(){
  document.getElementById('result').innerHTML=`
    <div class="state-msg">
      <span class="ic">⏳</span>
      กำลังค้นหาข้อมูล…
    </div>`;
}

function renderError(msg){
  document.getElementById('result').innerHTML=`
    <div class="state-msg err">
      <span class="ic">⚠️</span>
      ${msg}
    </div>`;
}

function renderNotFound(q){
  document.getElementById('result').innerHTML=`
    <div class="state-msg">
      <span class="ic">🔍</span>
      ไม่พบออเดอร์ที่ตรงกับ "${esc(q)}"<br><small>กรุณาตรวจสอบเลขออเดอร์หรือเลขแทร็กกิ้งอีกครั้ง</small>
    </div>`;
}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function tpHistoryHTML(tpEvents){
  if(!tpEvents||!tpEvents.length)return'';
  return `
    <div class="tp-history">
      <div class="tp-history-title">📦 ประวัติการขนส่งจากไปรษณีย์ไทย</div>
      ${tpEvents.map(ev=>`<div class="tp-event">
        <div class="tp-event-dot"></div>
        <div class="tp-event-body">
          <div class="tp-event-desc">${esc(ev.desc)}</div>
          <div class="tp-event-meta">${[ev.date,ev.location].filter(Boolean).map(esc).join(' · ')}</div>
        </div>
      </div>`).join('')}
    </div>`;
}

function renderResult(o,tpEvents){
  const cls=classifyStatus(o.status);
  const cancelled=cls==='problem';
  const step2done=cls==='packed'||cls==='delivered';
  const step3done=cls==='delivered';
  const pct=cancelled?0:(step3done?100:step2done?50:5);

  const labelMap={
    pending:'รอดำเนินการ / เตรียมจัดส่ง',
    packed:'แพ็คสินค้าแล้ว',
    delivered:'จัดส่งสำเร็จ',
    problem:'ออเดอร์ถูกยกเลิก'
  };

  const detailRows=[
    ['วันที่สั่งซื้อ',o.order_date||'-'],
    ['เลขแทร็กกิ้ง',o.tracking||'-',true],
    ['ผู้รับ',o.customer||'-'],
    ['ปลายทาง',[o.district,o.province].filter(Boolean).join(', ')||'-'],
  ];
  if(cancelled&&o.statusRaw) detailRows.push(['หมายเหตุ',o.statusRaw]);
  else if(step3done&&o.statusRaw&&o.statusRaw!=='1') detailRows.push(['บันทึกสถานะล่าสุด',o.statusRaw]);

  document.getElementById('result').innerHTML=`
    <div class="result-card">
      <div class="result-top">
        <div class="bottle-wrap">${bottleSVG(pct,cancelled)}</div>
        <div class="result-top-text">
          <div class="result-order">เลขออเดอร์ ${esc(o.order_id)}</div>
          <div class="result-status-label st-${cls}">${labelMap[cls]}</div>
        </div>
      </div>
      ${cancelled?`<div class="cancel-banner">✕ ออเดอร์นี้ถูกยกเลิก — หากมีข้อสงสัยกรุณาติดต่อทีมงาน</div>`:`
      <div class="timeline">
        <div class="tl-step done"><div class="tl-dot"><span>1</span></div><div class="tl-label">รับออเดอร์แล้ว</div></div>
        <div class="tl-step ${step2done?'done':''}"><div class="tl-line ${step2done?'done':''}"></div><div class="tl-dot"><span>2</span></div><div class="tl-label">แพ็คสินค้าแล้ว</div></div>
        <div class="tl-step ${step3done?'done':''}"><div class="tl-line ${step3done?'done':''}"></div><div class="tl-dot"><span>3</span></div><div class="tl-label">จัดส่งสำเร็จ</div></div>
      </div>`}
      <div class="detail-list">
        ${detailRows.map(([k,v,mono])=>`<div class="detail-row"><span class="k">${k}</span><span class="v${mono?' mono':''}">${esc(v)}</span></div>`).join('')}
      </div>
      ${tpHistoryHTML(tpEvents)}
    </div>`;
}

function renderTPOnlyResult(barcode,tpEvents){
  document.getElementById('result').innerHTML=`
    <div class="result-card">
      <div class="result-top">
        <div class="bottle-wrap">${bottleSVG(50,false)}</div>
        <div class="result-top-text">
          <div class="result-order">เลขแทร็กกิ้ง ${esc(barcode)}</div>
          <div class="result-status-label st-packed">พบข้อมูลจากไปรษณีย์ไทย</div>
        </div>
      </div>
      <div class="state-msg" style="margin:16px 22px 0;border:1px solid var(--border)">ไม่พบเลขนี้ในระบบออเดอร์ของ CFM แต่พบประวัติการขนส่งจากไปรษณีย์ไทยโดยตรง</div>
      ${tpHistoryHTML(tpEvents)}
    </div>`;
}

async function doSearch(){
  const input=document.getElementById('q');
  const btn=document.getElementById('btn');
  const q=input.value.trim();
  if(!q)return;
  btn.disabled=true;
  renderLoading();
  try{
    const rows=await loadRows();
    const nq=norm(q);
    let found=null;
    for(let i=1;i<rows.length;i++){
      const row=rows[i];
      const orderId=expandSciNotation(row[2]);
      const tracking=row[4];
      if(!orderId&&!tracking)continue;
      if(norm(orderId)===nq||norm(tracking)===nq){
        found={
          order_id:String(orderId||'').trim(),
          tracking:String(tracking||'').trim(),
          status:row[0],
          statusRaw:String(row[0]||'').trim(),
          order_date:formatOrderDate(row[7]),
          customer:row[49],
          district:row[55],
          province:row[54],
        };
        break;
      }
    }

    const barcodeForTP=(found&&found.tracking)||q;
    const tpData=await fetchThailandPostTracking(barcodeForTP);
    const tpEvents=tpData?extractTPEvents(tpData):[];

    if(found) renderResult(found,tpEvents);
    else if(tpEvents.length) renderTPOnlyResult(barcodeForTP,tpEvents);
    else renderNotFound(q);
  }catch(e){
    renderError('เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณาลองใหม่อีกครั้ง');
  }finally{
    btn.disabled=false;
  }
}

document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch();});
</script>
</body>
